[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ultima-scraper-db"
version = "0.5.0"
description = "Domain-neutral database runtime for UltimaScraper database modules"
readme = "README.md"
requires-python = ">=3.12,<4"
license = "AGPL-3.0-or-later"
authors = [
    { name = "UltimaHoarder", email = "21285176+UltimaHoarder@users.noreply.github.com" },
]
dependencies = [
    "alembic>=1.17,<2",
    "asyncpg>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0.44,<3",
]

[project.urls]
Homepage = "https://github.com/DATAHOARDERS/UltimaScraperDB"
Repository = "https://github.com/DATAHOARDERS/UltimaScraperDB"
Issues = "https://github.com/DATAHOARDERS/UltimaScraperDB/issues"

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["ultima_scraper_db"]

[tool.hatch.build.targets.sdist]
exclude = ["/old"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
